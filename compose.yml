services:
  postgres:
    image: postgres:16-alpine
    container_name: auth-postgres
    platform: linux/amd64
    environment:
      POSTGRES_DB: auth_test
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth_password
    ports:
      - "5432:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth_test"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  auth-postgres-data:
